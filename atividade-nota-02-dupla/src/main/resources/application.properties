spring.application.name=atividade-nota-02-dupla

# H2 console (opcional, para inspecionar o banco via navegador: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:atividade
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CONFIGURAÇÕES DO CACHE (lidas via @Value no ConteudoCache)
app.cache.max-itens=5
app.cache.ttl-segundos=60

# ATRASO ARTIFICIAL DA FONTE (lido via @Value no ConteudoService)
# 2000ms = 2 segundos, para ficar bem visível a diferença HIT vs MISS
app.fonte.atraso-ms=2000

# Logging: mostra logs do nosso cache (INFO) e SQL (se quiser)
logging.level.sptech.school.atividade_nota_02_dupla.cache=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE